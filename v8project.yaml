# yaml-language-server: $schema=https://raw.githubusercontent.com/alkoleft/v8-runner-rust/master/docs/schemas/v8project.schema.json
# Generated by v8-runner config init
workPath: 'build'
execution_timeout: 3600000
format: EDT
builder: DESIGNER
infobase:
  connection: 'File=f:/1C/Base/КупоросДляТестовEDT'
  user: 'Администратор'
source-set:
  - name: 'cf'
    type: CONFIGURATION
    path: 'src\cf'
  - name: 'YAXUNIT'
    type: EXTENSION
    path: 'src\cfe\Kyporos.YAXUNIT'
  - name: 'УправлениеДоступомПользователей'
    type: EXTENSION
    path: 'src\cfe\Kyporos.УправлениеДоступомПользователей'
tools:
  platform:
    version: '8.3.27'
tests:
  execution_timeout_seconds: 3600
  va:
    params_path: 'tools\VAParams.json'
    profile: 'all'
    timeouts:
      total_ms: 3600000
    profiles:
      all:
        feature_path: 'features'
        ignore_tags:
          - 'IgnoreOnCIMainBuild'
build:
  partialLoadThreshold: 20
